# Run configuration for ticket_to_pr. Registered as an immutable workflow
# version by factory/fabro/register.sh; SuperPlane starts runs from that id.
_version = 1

[workflow]
graph = "workflow.fabro"

# Defaults only — SuperPlane overrides every one of these per run.
[run.inputs]
repo = "dlapiduz/old-software-inc"
issue_number = "0"   # string: SuperPlane sends every input as text
issue_title = ""
issue_body = ""
issue_comments = ""

# Fabro opens the PR from its run branch once the run succeeds. Never
# auto-merge: a person reviews and merges (main is also protected by a ruleset).
[run.pull_request]
enabled = true
draft = false
auto_merge = false

[run.checkpoint]
exclude_globs = ["**/*.pyc", "**/.coverage", "**/*.db"]
